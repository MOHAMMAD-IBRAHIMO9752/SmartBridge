<body><div class="app" id="app"><header class="topbar"><button class="iconbtn mobilemenu" id="menuBtn" aria-label="Open menu">☰</button><div class="brand"><div class="brandmark">S</div><div><strong>SKILLBRIDGE</strong><small>Talent · Projects · Learning</small></div></div><div class="search"><span class="mag">⌕</span><input id="globalSearch" placeholder="Search pages, skills, projects…  /" autocomplete="off"></div><div class="topright"><div class="status"><span class="dot"></span> Systems nominal</div><button class="iconbtn" id="themeBtn" title="Toggle light/dark theme">◐</button><button class="iconbtn" id="notifyBtn" title="Notifications">♧</button><div class="avatar" title="Account"></div></div></header><div class="layout"><aside class="sidebar" id="sidebar"><div class="side-label">Command center</div><div id="nav"></div><div class="side-bottom"><div style="display:flex;justify-content:space-between;align-items:center"><strong>Platform readiness</strong><span class="pill violet">LIVE</span></div><p>Live workspace data will appear here when available.</p><div class="meter"><span></span></div><div style="display:flex;justify-content:space-between;margin-top:9px;font-size:10px;color:var(--muted)"><span>Workspace status</span><b>Ready</b></div></div></aside><main class="main" id="main"></main></div><div class="toast" id="toast"></div></div>
<script>
const groups=[{label:'Overview',items:[['overview','◈','Overview'],['execution','⌘','Execution flow'],['activity','◷','Activity timeline']]},{label:'Student workspace',items:[['profile','◎','Student profile'],['skills','◇','Skill inventory'],['discovery','⌕','Peer discovery'],['matching','⟷','Match insights'],['gap','⌁','Skill-gap analysis'],['goals','◎','Learning goals'],['resources','▤','Learning resources'],['dashboard','▦','Learning dashboard']]},{label:'Projects & teams',items:[['projects','▱','Project explorer'],['project-new','＋','Create project'],['project-detail','↗','Project workspace'],['team','♧','Team formation'],['requests','⇄','Join requests'],['members','♙','Team members']]},{label:'AI mentor / RAG',items:[['mentor','✳','AI mentor'],['knowledge','▤','Knowledge base'],['ingestion','⇧','Ingestion pipeline'],['retrieval','⌕','Semantic retrieval'],['sources','⊞','Source citations']]},{label:'Platform operations',items:[['notifications','♧','Notifications'],['admin','▦','Admin overview'],['users','♙','User management'],['security','⬡','Security & access'],['api','⌘','API explorer'],['database','▤','Data model'],['jobs','◴','Background jobs'],['observability','⌁','Observability'],['settings','⚙','Settings'],['onboarding','➜','Getting started']]}];
const pages={overview:['Overview','Your student-to-project operating system, from capability discovery to real collaboration.'],execution:['Industrial execution flow','Trace how a student action moves through the React client, secured Spring API, business services, MySQL, matching engine, and response.'],activity:['Activity timeline','A unified timeline of project events, learning milestones, and platform processing.'],profile:['Student profile','A structured capability profile used by discovery, matching, and personalized learning.'],skills:['Skill inventory','Normalize capabilities into a shared skill catalogue with transparent proficiency levels.'],discovery:['Peer discovery','Find peers by complementary skills, interests, and project intent.'],matching:['Match insights','Inspect why a student fits a project and which skills contribute to the score.'],gap:['Skill-gap analysis','Compare a selected project’s requirements with recorded skills and turn gaps into learning goals.'],goals:['Learning goals','Convert identified gaps into measurable learning objectives and track progress.'],resources:['Learning resources','Curated learning materials connected to skills, goals, and project domains.'],dashboard:['Learning dashboard','A personal cockpit for goals, skills, project participation, and next actions.'],projects:['Project explorer','Discover active projects, required skills, team capacity, and collaboration opportunities.'], 'project-new':['Create a project','Define a problem, required capabilities, team size, and collaboration expectations.'],'project-detail':['Project workspace','A project command surface for scope, required skills, team activity, and participation.'],team:['Team formation','Compose a balanced team by covering requirements and adding complementary capabilities.'],requests:['Join requests','Review and process membership requests with explicit ownership rules.'],members:['Team members','Manage project roles and understand each member’s contribution.'],mentor:['AI mentor','Ask technical questions and receive responses grounded in retrieved knowledge.'],knowledge:['Knowledge base','Manage trusted documents that support the SkillBridge mentor.'],ingestion:['Ingestion pipeline','Track document parsing, chunking, embedding, and vector storage stages.'],retrieval:['Semantic retrieval','Inspect the retrieval path from query embedding to ranked evidence chunks.'],sources:['Source citations','Review source provenance and evidence attached to mentor responses.'],notifications:['Notifications','Review collaboration events and learning milestones.'],admin:['Admin overview','Monitor platform adoption, project health, and controlled operational signals.'],users:['User management','Review account status and role assignments with least-privilege access.'],security:['Security & access','Inspect authentication controls, token policy, CORS, and access boundaries.'],api:['API explorer','Explore representative REST contracts and their expected response shapes.'],database:['Data model','Understand how student capabilities connect to project requirements and learning outcomes.'],jobs:['Background jobs','Track asynchronous document ingestion and other bounded background work.'],observability:['Observability','Follow health, latency, failures, and diagnostic signals without exposing secrets.'],settings:['Settings','Manage preferences and application configuration surfaces.'],onboarding:['Getting started','A guided route through the product’s core student workflow.']};
let current='overview',dark=true;const $=s=>document.querySelector(s);const nav=$('#nav');
function buildNav(){nav.innerHTML=groups.map(g=>`<div class="side-label">${g.label}</div>${g.items.map(([id,ic,name])=>`<button class="navitem ${current===id?'active':''}" data-page="${id}"><span class="ico">${ic}</span><span>${name}</span></button>`).join('')}`).join('');nav.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));}
function head(id,actions=''){let [title,desc]=pages[id];return `<div class="crumb">SkillBridge <span style="opacity:.5">/</span> ${title}</div><div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
const btn=(label,action='toast',cls='secondary')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
function metric(label,val,icon,trend,sub){return `<div class="card"><div class="metricrow"><span class="eyebrow">${label}</span><span class="metricicon">${icon}</span></div><div class="metric">${val}</div><div class="metricrow"><span class="tiny muted">${sub}</span><span class="trend">${trend}</span></div></div>`}
function flow(steps,active=1){return `<div class="flow">${steps.map((s,i)=>`<div class="flowstep ${i===active?'active':''}"><span class="stepnum">STEP 0${i+1}</span><strong>${s[0]}</strong><small>${s[1]}</small></div>`).join('')}</div>`}
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function section(title,desc='',right=''){return `<div class="sectionhead"><div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div>${right}</div>`}
function progress(label,pct,caption=''){return `<div style="margin:14px 0"><div class="metricrow"><span style="font-size:12px">${label}</span><b style="font-size:11px">${pct}%</b></div><div class="progressline"><span style="width:${pct}%"></span></div>${caption?`<div class="tiny muted">${caption}</div>`:''}</div>`}
function terminal(lines){return `<div class="terminal">${lines.map(l=>`<div>${l}</div>`).join('')}</div>`}
function timeline(items){return `<div class="timeline">${items.map((x,i)=>`<div class="timeline-item"><div class="timeline-mark"><i></i></div><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div>`}
function person(initials,name,sub){return `<div class="person"><div class="face">${initials}</div><div><b style="font-size:12px">${name}</b><div class="tiny muted">${sub}</div></div></div>`}
function render(id){const page=pages[id];if(!page)return;const [title,desc]=page;const c=head(id)+`<div class="card empty-state"><div class="metricicon">⌁</div><h2>No data available</h2><p>There is no ${title.toLowerCase()} data to display yet. Connect this module to the SkillBridge API to load your workspace records.</p></div>`;$('#main').innerHTML=c+`<div class="footer-note">SKILLBRIDGE · SPATIAL CONTROL SURFACE</div>`;wireActions();}function go(id){if(!pages[id])return;current=id;buildNav();render(id);$('#sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'});}
let toastTimer;function toast(msg='This action is unavailable until the connected service is ready.'){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function wireActions(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));}function saveProject(){}\nfunction runTrace(){}\n#themeBtn.onclick=()=>{dark=!dark;document.documentElement.style.colorScheme=dark?'dark':'light';toast(dark?'Dark spatial theme enabled.':'Light spatial theme enabled.');};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#notifyBtn').onclick=()=>go('notifications');$('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase().trim();let found=Object.entries(pages).find(([id,v])=>id.includes(q)||v[0].toLowerCase().includes(q)||v[1].toLowerCase().includes(q));if(found)go(found[0]);else toast('No matching page. Try “projects”, “RAG”, “skills”, or “security”.');}});document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#globalSearch').focus();}if(e.key==='Escape')$('#sidebar').classList.remove('open');});buildNav();render(current);
</script></body></html>
